name: Build CARGO APK V4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o Cargo_BLE_Test_V4.zip -d cargo

      - name: Build APK
        working-directory: cargo
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARGO-BLE-TEST-V4
          path: cargo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
